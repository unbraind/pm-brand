name: CI
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    # Strict required checks on main prevent merging checks against an older policy.
    env:
      IDENTITY_BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event_name == 'push' && github.sha) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: npm ci
      - run: npm run release:check
      - if: matrix.node == 26
        # Dependabot maintains package-lock.json; Bun consumes that same graph.
        run: bun install --no-save
      - if: matrix.node == 26
        run: bun run release:check
      - if: matrix.node == 26
        run: bun test ./test/bun.acceptance.ts
      - if: matrix.node == 26
        run: npm run test:git
