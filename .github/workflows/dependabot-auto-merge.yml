name: Dependabot auto-merge
on: pull_request
permissions: {}
jobs:
  enable:
    # There is no branch protection yet. Require a separate owner opt-in before
    # enabling auto-merge, otherwise --auto can merge immediately without CI.
    if: github.repository == 'unbraind/pm-brand' && vars.PM_BRAND_DEPENDABOT_AUTO_MERGE_ENABLED == 'true' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          steps.metadata.outputs.dependency-group == 'pm-toolchain' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
