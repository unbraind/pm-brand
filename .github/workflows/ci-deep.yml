name: CI Deep
on:
  push:
    branches: [main]
  schedule:
    - cron: '13 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deep:
    name: deep (${{ matrix.node }}, ${{ matrix.package-manager }})
    runs-on: ${{ vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
      IDENTITY_BASE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
        package-manager: [npm, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun --version
      - run: npm ci
      - name: Full npm release gate
        if: matrix.package-manager == 'npm'
        run: npm run release:check
      - run: bun install --no-save
      - name: Full Bun release gate
        if: matrix.package-manager == 'bun'
        run: bun run release:check
      - run: bun test ./test/bun.acceptance.ts
      - run: npm run test:git
