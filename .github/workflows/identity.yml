name: Trusted identity
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  trusted-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      # Only inspect the proposed tree as data. Never install or execute its code.
      - name: Audit proposed history with the trusted base gate
        env:
          IDENTITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROPOSED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NODE_OPTIONS: ''
          NODE_PATH: ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IDENTITY_BASE_SHA" =~ ^[a-f0-9]{40}$ && "$PROPOSED_SHA" =~ ^[a-f0-9]{40}$ && "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gate=$(mktemp "$RUNNER_TEMP/identity-XXXXXXXX.mts")
          trap 'rm -f "$gate"' EXIT
          git show "$IDENTITY_BASE_SHA:scripts/identity.ts" > "$gate"
          git -c core.hooksPath=/dev/null fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PROPOSED_SHA"
          git -c core.hooksPath=/dev/null checkout --detach --force "$PROPOSED_SHA"
          node "$gate"
